[package]
name = "microsip-linux"
version = "0.1.0"
edition = "2021"
description = "MicroSIP port to Linux — Rust + GTK4 SIP softphone with system tray (PJSIP-based)"
authors = ["Jesús Rafael Sánchez <jesusrafael@gmail.com>"]
license = "GPL-2.0-only"
repository = "https://github.com/gsusrafael/microsip-linux"

# cargo-deb metadata for Debian/Ubuntu packaging
[package.metadata.deb]
maintainer = "Jesús Rafael Sánchez <jesusrafael@gmail.com>"
depends = ["libgtk-4-0", "libayatana-appindicator3-1", "libdbusmenu-glib4", "libglib2.0-0"]
section = "net"
priority = "optional"
# cargo-deb: habilitar feature pjsip al construir el .deb
features = ["pjsip"]
# files installed by cargo-deb (binary + desktop + icon)
assets = [
    { source = "/home/jesus/Workspace/microsip-linux/target/release/microsip-linux", dest = "usr/bin" },
    { source = "/home/jesus/Workspace/microsip-linux/assets/microsip-linux.desktop", dest = "usr/share/applications" },
    { source = "/home/jesus/Workspace/microsip-linux/assets/icon.svg", dest = "usr/share/icons/hicolor/scalable/apps/microsip-linux.svg" },
]

[features]
default = ["tray"]
# Backend PJSIP real vía FFI (requiere pjproject compilado en ~/.local)
pjsip = []
# Bandeja del sistema (appindicator / KSNI). Requiere libayatana-appindicator3-dev en el host.
tray = ["tray-icon"]
no-tray = []

[dependencies]
gtk4 = { version = "0.6", default-features = false, features = ["v4_10"] }
glib = "0.17"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Bandeja del sistema (opcional)
tray-icon = { version = "0.5", optional = true }

[build-dependencies]
pkg-config = "0.3"

[workspace]

[profile.release]
opt-level = 3
lto = false
debug = false
